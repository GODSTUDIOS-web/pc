
name: Configure Cloud PC - MTA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-cloud-pc:
    # Executa na tua própria VM Windows registada no GitHub.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check Windows and hardware
        shell: powershell
        run: |
          Write-Host "=== CLOUD PC - MTA ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion,
              OsArchitecture

          Get-CimInstance Win32_ComputerSystem |
            Select-Object Name, TotalPhysicalMemory,
              NumberOfLogicalProcessors

          Get-CimInstance Win32_VideoController |
            Select-Object Name, AdapterRAM

          Get-Volume |
            Where-Object DriveLetter |
            Select-Object DriveLetter, FileSystem,
              SizeRemaining, Size

      - name: Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            $installer = "$env:TEMP\tailscale.msi"
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

            Invoke-WebRequest -Uri $url -OutFile $installer
            $process = Start-Process msiexec.exe `
              -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
              -Wait -PassThru

            Remove-Item $installer -Force -ErrorAction SilentlyContinue

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed."
            }
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "Configure the TAILSCALE_AUTH_KEY repository secret."
          }

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=mta-cloud-pc"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = (& $tsExe ip -4 | Select-Object -First 1).Trim()

          if (-not $tsIP) {
            throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enable secure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $tcpPath = "$rdpPath\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $rdpPath `
            -Name fDenyTSConnections -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty -Path $tcpPath `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Limit inbound RDP to Tailscale's IPv4 range.
          Get-NetFirewallRule -DisplayName "RDP-Tailscale-Only" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Secure RDP configuration completed."

      - name: Verify RDP
        shell: powershell
        run: |
          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP is not listening on port 3389."
          }

          Write-Host "Tailscale address: $env:TAILSCALE_IP"
          Write-Host "RDP port: 3389"
          Write-Host "Connect using Windows Remote Desktop."
